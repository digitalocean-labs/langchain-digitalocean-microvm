# The incident commander's Action Gateway policy (gateway.py loads it with ActionPolicy.from_yaml).
# Three tiers; anything not listed is denied. Versions are the catalog's released versions.
allow:                                # the investigators read
  - github_list_commits@5
  - github_compare_commits@4
  - digitalocean_droplet-get@3
  - digitalocean_image-list@2
ask:                                  # a human decides first: the run ends with an `action_approval` interrupt
  - digitalocean_restore-droplet@3
deny:                                 # refused by the gateway, whoever asks
  - digitalocean_droplet-delete@3
