[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "microvm-subagent"
version = "0.1.0"
description = "Graphs served inside a DigitalOcean MicroVM agent host (in-memory LangGraph Agent Server)"
requires-python = ">=3.11,<3.15"

dependencies = [
    "deepagents==0.7.29",
    "langgraph>=1.0.0,<2.0",
    "langgraph-cli[inmem]>=0.4.0",
    "langgraph-sdk>=0.4.0",
    "langchain-anthropic",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["agent", "auth"]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]
